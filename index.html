      html+='<strong>TRANSACTIONS</strong><br/>';
      filtered.slice().reverse().forEach(function(s){
        html+='<div class="tx">';
        html+='<div style="display:flex;justify-content:space-between">'
          +'<span style="font-size:11px;color:#666">'+s.id+' &bull; '+new Date(s.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'</span>'
          +'<span style="font-size:11px;color:#666">'+s.method+'</span>'
          +'</div>';
        if(s.ref)html+='<div style="font-size:11px;color:#666">Ref: '+s.ref+'</div>';
        html+='<table style="margin:4px 0">';
        s.items.forEach(function(it){
          html+='<tr>'
            +'<td style="padding:2px 0">x'+it.qty+'</td>'
            +'<td style="padding:2px 6px">'+it.name+'</td>'
            +'<td class="r" style="padding:2px 0">'+fmt(it.price*it.qty)+'</td>'
            +'</tr>';
        });
        html+='</table>';
        html+='<div style="text-align:right;font-weight:bold;border-top:1px solid #eee;padding-top:2px">Total: '+fmt(s.total)+'</div>';
        html+='</div>';
      });
      html+='<hr/><div style="text-align:center;font-size:11px;color:#666">Powered by Arroyo POS</div>';
      html+='<br/><div style="text-align:center"><button onclick="window.print()" style="padding:10px 24px;font-size:14px;cursor:pointer">Print</button></div>';
      html+='</body></html>';
      const win=window.open('','_blank','width=420,height=700');
      if(win){win.document.write(html);win.document.close();}
      else{toast('Allow popups to print report');}
    };
    printRow.appendChild(closeB);printRow.appendChild(printB);body.appendChild(printRow);
  }

    modal.appendChild(body);
  ov.appendChild(modal);
  app.appendChild(ov);
}

// ── CLOUD BANNER (shown when back online with pending items, or session expired) ──
let _bannerDismissed=false;
function renderCloudBanner(app){
  const pending=queueCount();
  const offline=!navigator.onLine;
  // Only show banner when online and there are pending items to push
  if(offline||pending===0||_bannerDismissed||!CLOUD.token||!CLOUD.bizId)return;
  const banner=document.createElement('div');banner.className='cloud-banner save';
  const ico=document.createTextNode('☁️ ');
  const lbl=document.createElement('span');lbl.textContent=pending+' offline item'+(pending>1?'s':'')+' — tap to save to cloud';
  const cls=document.createElement('button');cls.className='cloud-banner-close';cls.innerHTML='&times;';
  cls.onclick=function(e){e.stopPropagation();_bannerDismissed=true;banner.remove();};
  banner.onclick=async function(){
    banner.className='cloud-banner saving';lbl.textContent='Saving to cloud…';
    const authed=await ensureAuth();
    if(!authed){lbl.textContent='Session expired — sign in again';setTimeout(()=>banner.remove(),2500);return;}
    const n=await flushSyncQueue(null);
    _bannerDismissed=true;
    toast('Saved '+pending+' item'+(pending>1?'s':'')+' to cloud ✓');
    banner.remove();
    await loadCloudData(true);render();
  };
  banner.appendChild(ico);banner.appendChild(lbl);banner.appendChild(cls);
  app.appendChild(banner);
}

// ── PROACTIVE TOKEN REFRESH — schedule refresh before JWT expiry ──
function scheduleTokenRefresh(){
  if(!CLOUD.token)return;
  try{
    // Parse JWT exp claim (no library needed — it's base64url)
    const payload=JSON.parse(atob(CLOUD.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!payload.exp)return;
    const msUntilExpiry=(payload.exp*1000)-Date.now();
    // Refresh 5 minutes before expiry (or immediately if already within 5 min)
    const refreshIn=Math.max(0,msUntilExpiry-5*60*1000);
    console.log('[Arroyo] Token refresh scheduled in '+(refreshIn/1000/60).toFixed(1)+'m');
    setTimeout(async function(){
      if(!CLOUD.token)return;
      const ok=await refreshSession();
      if(ok){
        console.log('[Arroyo] Proactive token refresh succeeded');
        scheduleTokenRefresh(); // schedule next refresh
      } else {
        // Refresh failed — show re-auth when user next tries an action
        // Don't interrupt them silently — they'll get the re-auth modal on next sync/action
        console.warn('[Arroyo] Proactive token refresh failed — will re-auth on next action');
        // Show a subtle notification dot change
        const dot=document.getElementById('netDot');
        const lbl=document.getElementById('netLbl');
        if(dot){dot.style.background='var(--wt)';}
        if(lbl){lbl.textContent='SESSION';}
      }
    },refreshIn);
  }catch(e){console.warn('[Arroyo] scheduleTokenRefresh error:',e);}
}

// ── ONLINE / OFFLINE EVENT HANDLERS ──
window.addEventListener('offline',function(){
  const dot=document.getElementById('netDot');
  const lbl=document.getElementById('netLbl');
  if(dot){dot.className='net-dot offline';}
  if(lbl){lbl.textContent='OFFLINE';}
  toast('You\'re offline — sales save locally ✓');
});

window.addEventListener('online',async function(){
  const dot=document.getElementById('netDot');
  const lbl=document.getElementById('netLbl');
  if(dot){dot.className='net-dot online';}
  if(lbl){lbl.textContent='';}

  if(!CLOUD.token||!CLOUD.bizId)return;

  const pending=queueCount();
  if(pending>0){
    // Reset banner dismissed state so the banner shows again
    _bannerDismissed=false;
    render(); // re-render shows the cloud banner
  } else {
    // No pending items — just silently pull latest from cloud
    toast('Back online — syncing…');
    const authed=await ensureAuth();
    if(authed){await loadCloudData(true);render();toast('Synced ✓');}
  }
});

// ── BARCODE SCANNER INPUT ────────────────────────────────────
// USB / Bluetooth scanners act as keyboards: they type the code
// very fast then send Enter. We buffer keystrokes and resolve on
// Enter. Typing into a form field is never intercepted.
let _scanBuf='',_scanLast=0;
function findByBarcode(code){
  const c=String(code||'').trim().toLowerCase();
  if(!c)return null;
  return S.prods.find(function(p){return (p.barcode||'').trim().toLowerCase()===c;})||null;
}
function scanAddToCart(p){
  if(p.stock!==999&&p.stock<=0){toast(p.name+' is out of stock');return;}
  if(p.variants&&p.variants.length>0){openModal({type:'variantPick',prod:p});return;}
  const effPrice=(p.salePct>0)?+(p.price*(1-p.salePct/100)).toFixed(2):p.price;
  const ex=S.cart.find(function(i){return i.id===p.id&&!i.variantLabel;});
  if(ex)ex.qty++;
  else S.cart.push({id:p.id,name:p.name,price:effPrice,qty:1,note:'',origPrice:p.salePct>0?p.price:null,salePct:p.salePct||0});
  render();toast('\u2713 '+p.name+' \u00b7 scanned');
}
document.addEventListener('keydown',function(e){
  // Never hijack real typing
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  // Only on the POS product grid, with no modal open
  if(S.screen!=='pos'||S.cartOpen||S.modal)return;
  const now=Date.now();
  if(now-_scanLast>300)_scanBuf='';
  _scanLast=now;
  if(e.key==='Enter'){
    const code=_scanBuf;_scanBuf='';
    if(code.length<3)return;
    const p=findByBarcode(code);
    if(p){e.preventDefault();scanAddToCart(p);}
    else toast('No product with barcode '+code);
    return;
  }
  if(e.key.length===1)_scanBuf+=e.key;
});
// ── END BARCODE SCANNER ──────────────────────────────────────

load();render();
// Auto-sync from cloud on every app open if signed in
(async function(){
  if(CLOUD.token&&CLOUD.bizId){
    // Proactively refresh token on every app open, then schedule future refreshes
    if(CLOUD.refresh){
      await refreshSession();
    } else {
      await ensureAuth();
    }
    scheduleTokenRefresh();
    // Flush any offline queue first before pulling from cloud
    const pending=queueCount();
    if(pending>0){
      console.log('[Arroyo] Auto-flushing '+pending+' offline item(s) on app open...');
      await flushSyncQueue(null);
      toast('Synced '+pending+' offline item'+(pending>1?'s':'')+' ✓');
    }
    await loadCloudData(true);
    render();
  }
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
</script>
<script>
/* ==================================================================== *
 * ARROYO POS — ONLINE ORDERS INBOX  (template 5.0)
 * Self-contained overlay rather than a new page in the POS's own render
 * framework, so it cannot destabilise the existing screens. It polls the
 * orders table for channel='web' rows, and hands an accepted order to the
 * POS by writing into S.cart and calling the POS's own render().
 * ==================================================================== */
(function(){
  'use strict';
  var CFG=(typeof SHOP_LINK!=='undefined')?SHOP_LINK:{enabled:false};
  if(!CFG.enabled)return;

  var POLL_MS=45000,seen={},lastCount=0,busy=false;

  function hdrs(){
    if(typeof cloudHeaders==='function')return cloudHeaders();
    return {'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
  }
  function ready(){
    return typeof CLOUD!=='undefined'&&CLOUD&&CLOUD.token&&CLOUD.bizId;
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(n){
    try{return '\u20b1'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
    catch(e){return '\u20b1'+Number(n||0).toFixed(2);}
  }
  function when(iso){
    try{var d=new Date(iso);var m=Math.round((Date.now()-d)/60000);
      if(m<1)return 'just now';if(m<60)return m+'m ago';
      if(m<1440)return Math.round(m/60)+'h ago';return d.toLocaleDateString();}
    catch(e){return '';}
  }

  /* ---- UI shell ---------------------------------------------------- */
  var css=document.createElement('style');
  css.textContent=
  '#oo-fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:900;'+
    'background:#2f81f7;color:#fff;border:none;border-radius:26px;padding:12px 17px;font:inherit;'+
    'font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.28);display:none;'+
    'align-items:center;gap:8px;min-height:46px}'+
  '#oo-fab.on{display:inline-flex}'+
  '#oo-fab .oo-n{background:#fff;color:#2f81f7;border-radius:12px;min-width:22px;padding:1px 6px;'+
    'font-size:12px;font-weight:800;text-align:center}'+
  '#oo-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:950;display:none;'+
    'align-items:flex-end;justify-content:center}'+
  '#oo-ov.on{display:flex}'+
  '@media(min-width:640px){#oo-ov.on{align-items:center}}'+
  '#oo-sheet{background:#16161a;color:#f2f2f0;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;'+
    'border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));'+
    'font-family:inherit}'+
  '@media(min-width:640px){#oo-sheet{border-radius:18px;max-height:86dvh}}'+
  '#oo-sheet h3{font-size:17px;font-weight:800;margin:0}'+
  '.oo-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}'+
  '.oo-x{background:rgba(255,255,255,.1);border:none;color:#f2f2f0;border-radius:9px;width:34px;height:34px;'+
    'font-size:19px;cursor:pointer;line-height:1}'+
  '.oo-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);border-radius:13px;'+
    'padding:13px 14px;margin-bottom:11px}'+
  '.oo-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}'+
  '.oo-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:800;'+
    'color:#7fb2ff;letter-spacing:.5px}'+
  '.oo-who{font-size:15px;font-weight:800;margin-top:3px}'+
  '.oo-sub{font-size:12px;color:#a4a4a0;margin-top:2px;line-height:1.55}'+
  '.oo-amt{font-size:17px;font-weight:800;white-space:nowrap}'+
  '.oo-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;border-radius:5px;'+
    'padding:2px 7px;margin-top:6px}'+
  '.oo-tag.pick{background:rgba(63,185,80,.16);color:#5ed46f}'+
  '.oo-tag.del{background:rgba(210,153,34,.16);color:#e0ac3c}'+
  '.oo-items{font-size:13px;color:#d6d6d2;margin-top:9px;padding-top:9px;'+
    'border-top:1px solid rgba(255,255,255,.09);line-height:1.65}'+
  '.oo-act{display:flex;gap:8px;margin-top:12px}'+
  '.oo-act button{flex:1;border:none;border-radius:9px;padding:11px;font:inherit;font-size:13px;'+
    'font-weight:800;cursor:pointer;min-height:44px}'+
  '.oo-ok{background:#2f81f7;color:#fff}'+
  '.oo-rd{background:rgba(63,185,80,.18);color:#5ed46f}'+
  '.oo-no{background:rgba(248,81,73,.16);color:#ff7b72}'+
  '.oo-empty{text-align:center;color:#8d8d89;font-size:13px;padding:38px 16px;line-height:1.7}'+
  '.oo-note{font-size:11px;color:#8d8d89;text-align:center;margin-top:6px}';
  document.head.appendChild(css);

  var fab=document.createElement('button');
  fab.id='oo-fab';
  fab.innerHTML='\uD83C\uDF10 Online <span class="oo-n" id="oo-n">0</span>';
  fab.onclick=open;
  document.body.appendChild(fab);

  var ov=document.createElement('div');
  ov.id='oo-ov';
  ov.innerHTML='<div id="oo-sheet"></div>';
  ov.onclick=function(e){if(e.target===ov)close();};
  document.body.appendChild(ov);

  function close(){ov.classList.remove('on');}
  function open(){ov.classList.add('on');paint(null);fetchOrders(false);}

  /* ---- data ------------------------------------------------------- */
  var CACHE=[];

  async function fetchOrders(silent){
    if(!ready()||busy)return;
    busy=true;
    try{
      var q='/rest/v1/orders?biz_id=eq.'+CLOUD.bizId+
            '&channel=eq.web&status=in.(pending,ready)&order=created_at.desc&limit=50';
      var r=await fetch(SUPA_URL+q,{headers:hdrs()});
      if(!r.ok){busy=false;return;}
      var rows=await r.json();
      if(!Array.isArray(rows)){busy=false;return;}
      CACHE=rows;
      var pending=rows.filter(function(o){return o.status==='pending';});
      document.getElementById('oo-n').textContent=rows.length;
      fab.classList.toggle('on',rows.length>0);
      /* announce genuinely new arrivals only */
      var fresh=pending.filter(function(o){return !seen[o.id];});
      pending.forEach(function(o){seen[o.id]=1;});
      if(fresh.length&&!silent===false&&typeof toast==='function'&&lastCount>0){
        toast(fresh.length===1?'New online order \uD83C\uDF10':fresh.length+' new online orders \uD83C\uDF10');
      }
      lastCount=rows.length;
      if(ov.classList.contains('on'))paint(rows);
    }catch(e){/* offline — try again next tick */}
    busy=false;
  }

  function paint(rows){
    var sh=document.getElementById('oo-sheet');
    var head='<div class="oo-hd"><h3>\uD83C\uDF10 Online orders</h3>'+
             '<button class="oo-x" onclick="__ooClose()">&times;</button></div>';
    if(rows===null){sh.innerHTML=head+'<div class="oo-empty">Loading\u2026</div>';return;}
    if(!rows.length){
      sh.innerHTML=head+'<div class="oo-empty">No online orders waiting.<br>'+
        'Orders placed on your website appear here.</div>';return;
    }
    sh.innerHTML=head+rows.map(function(o){
      var its=Array.isArray(o.items)?o.items:[];
      var del=o.fulfilment==='delivery';
      var lines=its.length
        ? its.map(function(i){return esc(i.name)+' \u00d7'+i.qty;}).join(' \u00b7 ')
        : esc(o.notes||'');
      return '<div class="oo-card">'+
        '<div class="oo-top"><div>'+
          '<div class="oo-ref">'+esc(o.order_no||'WEB')+' \u00b7 '+when(o.created_at)+'</div>'+
          '<div class="oo-who">'+esc(o.customer_name||'Customer')+'</div>'+
          '<div class="oo-sub">'+esc(o.customer_phone||'')+
            (del&&o.address?'<br>'+esc(o.address):'')+'</div>'+
          '<span class="oo-tag '+(del?'del':'pick')+'">'+(del?'DELIVERY':'PICKUP')+'</span>'+
          (o.status==='ready'?' <span class="oo-tag rd" style="background:rgba(63,185,80,.16);color:#5ed46f">ACCEPTED</span>':'')+
        '</div><div class="oo-amt">'+money(o.total)+'</div></div>'+
        '<div class="oo-items">'+lines+'</div>'+
        '<div class="oo-act">'+
          (o.status==='pending'
            ? '<button class="oo-rd" onclick="__ooAccept(\''+o.id+'\')">Accept</button>'
            : '')+
          '<button class="oo-ok" onclick="__ooRing(\''+o.id+'\')">Load into cart</button>'+
          '<button class="oo-no" onclick="__ooReject(\''+o.id+'\')">Cancel</button>'+
        '</div></div>';
    }).join('')+
    '<div class="oo-note">"Load into cart" fills the register so you can take payment as normal. '+
    'Mark it done from the Orders page on your dashboard once paid.</div>';
  }

  async function setStatus(id,status){
    if(!ready())return false;
    try{
      var r=await fetch(SUPA_URL+'/rest/v1/orders?id=eq.'+id+'&biz_id=eq.'+CLOUD.bizId,
        {method:'PATCH',headers:{...hdrs(),'Prefer':'return=representation'},
         body:JSON.stringify({status:status})});
      return r.ok;
    }catch(e){return false;}
  }

  window.__ooClose=close;

  window.__ooAccept=async function(id){
    var ok=await setStatus(id,'ready');
    if(typeof toast==='function')toast(ok?'Order accepted \u2713':'Could not update — check connection');
    fetchOrders(true);
  };

  window.__ooReject=async function(id){
    if(!confirm('Cancel this online order? The customer will need to be told.'))return;
    var ok=await setStatus(id,'cancelled');
    if(typeof toast==='function')toast(ok?'Order cancelled':'Could not update — check connection');
    fetchOrders(true);
  };

  /* Hand the order to the register. Matches on local_id where possible so
     stock and reporting behave exactly like a counter sale; falls back to a
     loose line item when the product has since been deleted. */
  window.__ooRing=function(id){
    var o=CACHE.filter(function(x){return x.id===id;})[0];
    if(!o){return;}
    if(typeof S==='undefined'||!S){return;}
    var its=Array.isArray(o.items)?o.items:[];
    if(!its.length){
      if(typeof toast==='function')toast('This order has no line items');
      return;
    }
    if(S.cart&&S.cart.length&&!confirm('The register already has items. Replace them with this order?'))return;
    S.cart=[];
    its.forEach(function(i){
      var p=(S.prods||[]).filter(function(x){return String(x.id)===String(i.local_id);})[0];
      S.cart.push({
        id:p?p.id:('web-'+Math.random().toString(36).slice(2,8)),
        name:i.name,
        price:Number(i.price)||0,
        qty:Number(i.qty)||1,
        note:'Online '+(o.order_no||'')
      });
    });
    S.cartOpen=true;
    if(S.screen!=='pos')S.screen='pos';
    close();
    if(typeof save==='function')save();
    if(typeof render==='function')render();
    if(typeof toast==='function')toast('Order '+(o.order_no||'')+' loaded \u2014 take payment');
  };

  /* ---- polling ---------------------------------------------------- */
  function tick(){if(ready())fetchOrders(true);}
  setTimeout(tick,4000);
  setInterval(tick,POLL_MS);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')tick();
  });
})();
</script>
